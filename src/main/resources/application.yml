spring:
  application:
    name: ms-customer
  config:
    import: optional:configserver:http://localhost:8888
  data:
    mongodb:
      uri: mongodb://devuser:devpassword@localhost:27017/customer_db?authSource=admin
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8081

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
